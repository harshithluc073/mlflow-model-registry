name: Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'api/**'
      - 'docker/**'
      - 'requirements.txt'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ghcr.io/${{ github.repository }}/mlflow-api
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=semver,pattern={{version}}
    
    - name: Build and push MLflow image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: docker/mlflow/Dockerfile
        push: true
        tags: ghcr.io/${{ github.repository }}/mlflow-server:latest
        cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/mlflow-server:buildcache
        cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/mlflow-server:buildcache,mode=max
    
    - name: Build and push API image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: docker/api/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/mlflow-api:buildcache
        cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/mlflow-api:buildcache,mode=max