version: '3.8'

services:
  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    container_name: mlflow-server
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    environment:
      - MLFLOW_BACKEND_STORE_URI=file:///app/data/mlruns
      - MLFLOW_ARTIFACT_ROOT=/app/data/mlartifacts
    networks:
      - mlops-network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: mlflow-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - mlflow
    networks:
      - mlops-network
    restart: unless-stopped

networks:
  mlops-network:
    driver: bridge

volumes:
  mlflow-data: